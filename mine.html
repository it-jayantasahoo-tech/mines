<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Utkal C Mines Portal</title>

<!-- PDF Export Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 0; }
    .container { max-width: 850px; margin: auto; margin-top: 25px; background: white; padding: 20px; border-radius: 8px; 
                 box-shadow: 0 0 12px rgba(0,0,0,0.15); }
    h1 { text-align: center; color: #222; }
    .tabs { text-align: center; margin-bottom: 20px; }
    .tab-button { padding: 10px 18px; margin: 0 5px; border: none; background-color: #ddd; cursor: pointer; border-radius: 4px; }
    .tab-button.active { background-color: #007bff; color: white; }
    form { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, button, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; font-weight: bold; }
    .action-btn { padding: 5px 10px; border: none; cursor: pointer; border-radius: 4px; }
    .edit-btn { background: #28a745; color: white; }
    .delete-btn { background: #dc3545; color: white; }
    .logout-btn { background: #ff5733; margin-top: 10px; }
    .admin-box { padding: 10px; background: #fafafa; border: 1px solid #ccc; border-radius: 5px; }
    @media (max-width: 600px) {
        .container { width: 95%; padding: 10px; }
        table { font-size: 14px; }
        input, button { padding: 8px; }
    }
</style>
</head>
<body>

<div class="container">

<h1>Utkal C Mines Portal</h1>

<!-- Tabs -->
<div class="tabs">
    <button class="tab-button active" onclick="showSection('login', this)">Login</button>
    <button class="tab-button" onclick="showSection('register', this)">Register</button>
</div>

<!-- Login -->
<div id="login-section">
    <h2>Login</h2>
    <form id="login-form">
        <label>Username:</label>
        <input type="text" id="login-username" required />

        <label>Password:</label>
        <input type="password" id="login-password" required />

        <button type="submit">Login</button>
    </form>
</div>

<!-- Register -->
<div id="register-section" style="display:none;">
    <h2>Create Account</h2>
    <form id="register-form">
        <label>Username:</label>
        <input type="text" id="reg-username" required />

        <label>Password:</label>
        <input type="password" id="reg-password" required />

        <label>Confirm Password:</label>
        <input type="password" id="confirm-password" required />

        <label>Account Type:</label>
        <select id="account-type" required>
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Register</button>
    </form>
</div>

<!-- Data Entry Section -->
<div id="data-section" style="display:none;">
    <h2>Mine Data Entry</h2>

    <button class="logout-btn" onclick="logout()">Logout</button>

    <label>Search Mines:</label>
    <input type="text" id="search-box" placeholder="Search mine name or location..." onkeyup="filterTable()" />

    <form id="data-form">
        <label>Mine Name:</label>
        <input type="text" id="mine-name" required />

        <label>Location:</label>
        <input type="text" id="location" required />

        <label>Annual Production (tons):</label>
        <input type="number" id="production" required />

        <button type="submit">Add Mine</button>
    </form>

    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportPDF()">Export PDF</button>

    <h3>Mine Data</h3>
    <table id="data-table">
        <thead>
            <tr>
                <th>Mine Name</th>
                <th>Location</th>
                <th>Production</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <br>

    <!-- Admin Panel -->
    <div id="admin-panel" style="display:none;">
        <h2>Admin Panel</h2>
        <div class="admin-box">
            <h3>Registered Users</h3>
            <table id="user-table">
                <thead>
                    <tr><th>Username</th><th>Type</th><th>Action</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

</div>

</div>
